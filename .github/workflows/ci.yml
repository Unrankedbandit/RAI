name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs on the same ref — keeps the queue fast on a sprint day
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  agent-backend:
    name: Agent backend (schema + contract)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent_backend/requirements.txt
      - name: Install dependencies
        run: pip install -r agent_backend/requirements.txt
      - name: Import check
        run: python -c "from agent_backend import main, pipeline, schemas, tools, sentinel_adapter; from agent_backend.agents import base, roles; print('imports OK')"
      - name: Agent reports conform to agent schema (pydantic)
        run: |
          python - <<'PY'
          import pathlib
          from agent_backend.schemas import Report
          for p in sorted(pathlib.Path("agent_backend/reports").glob("*.json")):
              Report.model_validate_json(p.read_text(encoding="utf-8"))
              print("valid:", p.name)
          PY
      - name: Regenerate Sentinel outputs from agent reports
        run: python -m agent_backend.sentinel_adapter
      - name: Sentinel samples are fresh (no stale contract fixtures)
        run: |
          if ! git diff --exit-code --quiet agent_backend/sentinel-samples; then
            echo "::error::sentinel-samples are stale. Run 'python -m agent_backend.sentinel_adapter' and commit the regenerated files."
            git diff --stat agent_backend/sentinel-samples
            exit 1
          fi
          echo "sentinel-samples in sync with reports"
      - name: Sentinel outputs conform to frontend schema (ProjectDetail)
        run: node scripts/validate-sentinel.mjs
      - name: TS and Python adapters are in lockstep
        run: node scripts/test-adapter-parity.mjs

  unit:
    name: Unit tests (offline, no LLM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent_backend/requirements.txt
      - name: Install dependencies
        run: pip install -r agent_backend/requirements.txt
      - name: Unit tests — schemas / grid helpers / agent tier + JSON salvage
        run: python scripts/test_unit.py
      - name: Offline verification suites (stubbed pipeline)
        run: |
          python scripts/test-gap-gate.py
          python scripts/test-agent-timeouts.py
          python scripts/test-brightdata.py
          python scripts/test-in-app-review.py
          python scripts/test-port-factory.py

  integration:
    name: Integration tests (API contract, in-process)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent_backend/requirements.txt
      - name: Install dependencies
        run: pip install -r agent_backend/requirements.txt
      - name: API contract via FastAPI TestClient (no LLM key, no network)
        run: python scripts/test_integration.py

  e2e:
    name: E2E (upload → analyze → SSE → portfolio)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent_backend/requirements.txt
      - run: pip install -r agent_backend/requirements.txt
      - name: Start the agent backend
        run: |
          python -m uvicorn agent_backend.main:app --port 8000 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/api/projects > /dev/null && exit 0
            sleep 1
          done
          echo "backend never came up"; exit 1
      - name: Run E2E
        env:
          E2E_SKIP_FRONTEND: "1"
        run: python scripts/e2e.py
