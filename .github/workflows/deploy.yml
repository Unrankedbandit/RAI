name: Deploy

# Manual CD for the live stack (rai-live.josephbissell.com).
# Two delivery routes, picked automatically by the `strategy` job:
#   runner — preferred: a self-hosted runner on the box runs deploy/deploy.sh
#            locally. The box is outbound-only (cloudflared), so nothing has to
#            reach in. Set up once with deploy/install-runner.sh.
#   ssh    — fallback: stream deploy/deploy.sh over SSH (needs the box to be
#            reachable on port 22 + repo secret SSH_PRIVATE_KEY / var DEPLOY_HOST).
# After either route, `smoke` gates the run against the public URLs.
#
# Setup: deploy/README.md. Fork-friendly: with neither route configured the
# run skips green (same convention as smoke.yml).

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or SHA to deploy"
        required: true
        default: "main"
      force:
        description: "Deploy even if CI is not green on this ref (and clobber dirty server checkout)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

# Never cancel a deploy mid-flight; queue them instead.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  guard:
    name: CI must be green on the target ref
    runs-on: ubuntu-latest
    steps:
      - name: Resolve ref and check CI conclusion
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ inputs.ref }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$REF" --jq .sha)"
          echo "resolved $REF -> $sha"
          conclusion="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$sha&per_page=1" \
            --jq '.workflow_runs[0].conclusion // "none"')"
          echo "CI conclusion for $sha: $conclusion"
          if [ "$conclusion" != "success" ]; then
            if [ "$FORCE" = "true" ]; then
              echo "::warning::CI is '$conclusion' on $sha — deploying anyway (force=true)"
            else
              echo "::error::CI is '$conclusion' on $sha. Fix main first, or rerun with force=true."
              exit 1
            fi
          fi

  strategy:
    name: Pick deploy route
    needs: guard
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.pick.outputs.mode }}
    steps:
      # GITHUB_TOKEN can't list self-hosted runners (that endpoint needs repo
      # Administration, which workflow tokens can't hold), so the route is
      # explicit configuration: DEPLOY_ROUTE=runner|ssh. Unset -> SSH if
      # configured -> skip green (fork-friendly, same convention as smoke.yml).
      - name: Route from repo configuration
        id: pick
        env:
          ROUTE: ${{ vars.DEPLOY_ROUTE }}
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          route="${ROUTE:-}"
          if [ -z "$route" ]; then
            if [ -n "$SSH_KEY" ] && [ -n "$SSH_HOST" ]; then route=ssh; else route=none; fi
          fi
          echo "deploy route: $route"
          [ "$route" = "none" ] && echo "::notice::no deploy route — set repo variable DEPLOY_ROUTE=runner (box runner) or configure SSH. Skipping green."
          echo "mode=$route" >> "$GITHUB_OUTPUT"

  deploy_runner:
    name: Deploy on the box (self-hosted runner)
    needs: strategy
    if: needs.strategy.outputs.mode == 'runner'
    runs-on: self-hosted
    # If the runner is offline the job queues — cap that wait so a dead runner
    # surfaces as a red run instead of a silent hang.
    timeout-minutes: 10
    steps:
      # Checked out on the box so deploy.sh is always the version from the ref
      # being deployed; the script itself operates on $DEPLOY_PATH.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Run deploy.sh locally
        env:
          REF: ${{ inputs.ref }}
          FORCE: ${{ inputs.force && '1' || '0' }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: bash deploy/deploy.sh

  deploy_ssh:
    name: Deploy over SSH (fallback)
    needs: strategy
    if: needs.strategy.outputs.mode == 'ssh'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Stream deploy.sh over SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          REF: ${{ inputs.ref }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          install -m 600 -D /dev/null "$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/deploy_key"
          mkdir -p ~/.ssh
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          remote_env="REF='$REF'"
          [ "$FORCE" = "true" ] && remote_env="$remote_env FORCE=1"
          [ -n "${DEPLOY_PATH:-}" ] && remote_env="DEPLOY_PATH='$DEPLOY_PATH' $remote_env"

          ssh -i "$RUNNER_TEMP/deploy_key" -o StrictHostKeyChecking=accept-new \
            "${DEPLOY_USER:-bob}@$DEPLOY_HOST" "$remote_env bash -s" < deploy/deploy.sh

  smoke:
    name: Post-deploy smoke gate
    needs: [deploy_runner, deploy_ssh]
    if: always() && (needs.deploy_runner.result == 'success' || needs.deploy_ssh.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Smoke the fresh deployment
        env:
          SMOKE_BASE_URL: ${{ vars.SMOKE_BASE_URL }}
          SMOKE_WEB_URL: ${{ vars.SMOKE_WEB_URL }}
          SMOKE_TOKEN: ${{ secrets.SMOKE_TOKEN }}
        run: python scripts/smoke.py
